<!DOCTYPE html>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {

  .btn-app  { background:rgba(255,255,255,.06); color:#f3e9d2; border:1px solid rgba(232,196,118,.5); }

  <div class="card">
